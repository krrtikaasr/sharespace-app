<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareSpace - Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8FAFC;font-family:Inter,system-ui,sans-serif;color:#0F172A;text-align:center;padding:24px}
  .box{max-width:340px}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);margin:0 auto 20px}
  h1{font-size:20px;margin:0 0 8px} p{font-size:14px;color:#64748B;margin:0 0 20px}
  button{background:#2563EB;color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"></div>
    <h1>Kamu sedang offline</h1>
    <p>Sambungkan ke internet, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
